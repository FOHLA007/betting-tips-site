<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin Live</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Poppins;
  background: #0b0f1a;
  color: white;
}

header {
  background: linear-gradient(135deg,#ffb400,#ff3b3b);
  padding: 20px;
  text-align: center;
}

.container {
  padding: 15px;
}

.card {
  background: #121a2a;
  padding: 15px;
  margin: 10px 0;
  border-radius: 12px;
}

.match {
  border-left: 4px solid #ffb400;
  padding: 10px;
  margin: 10px 0;
  background: #0f1726;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
<h2>🔥 FohlaWin Live Matches</h2>
<p>Real-time updates</p>
</header>

<div class="container">

<div class="card">
<h3>⚽ Matches</h3>
<div id="matches">Loading matches...</div>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const container = document.getElementById("matches");

const today = new Date().toISOString().split("T")[0];

// 🔥 ONLY ONE FIXED PATH (THIS IS THE KEY)
const matchesRef = ref(db, "matches/" + today);

let loaded = false;

// fallback if Firebase fails
setTimeout(() => {
  if (!loaded) {
    container.innerHTML = "<p>No matches found today</p>";
  }
}, 5000);

// listen to matches
onValue(matchesRef, (snapshot) => {

  loaded = true;

  const data = snapshot.val();

  if (!data) {
    container.innerHTML = "<p>No matches available today</p>";
    return;
  }

  let html = "";

  Object.values(data).forEach(m => {

    html += `
      <div class="match">
        <b>${m.home || "Team A"} vs ${m.away || "Team B"}</b>
        <p>Score: ${m.score || "0-0"}</p>
        <p>Status: ${m.status || "pending"}</p>
      </div>
    `;
  });

  container.innerHTML = html;
});
</script>

</body>
</html>
