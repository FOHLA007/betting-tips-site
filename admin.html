<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body {
  font-family:Poppins;
  background:#0b0f1a;
  color:white;
  padding:20px;
}

.card {
  background:#121a2a;
  padding:15px;
  border-radius:12px;
  max-width:600px;
  margin:auto;
}

input,button,select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button {
  background:gold;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>⚙ Admin Dashboard</h2>

<div class="card">

<h3>📊 Add Tip (AUTO MATCH SELECT)</h3>

<!-- MATCH DROPDOWN -->
<select id="matchSelect">
  <option>Loading matches...</option>
</select>

<!-- TIP -->
<input id="tip" placeholder="Enter tip (e.g Over 2.5 goals)">

<button onclick="addTip()">ADD TIP</button>

<hr>

<h3>💰 Add VIP User</h3>
<input id="vipPhone" placeholder="27821234567">
<input id="vipExpiry" placeholder="YYYY-MM-DD">
<button onclick="addVIP()">ADD VIP</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

// =====================
// LOAD MATCHES INTO DROPDOWN
// =====================
async function loadMatches(){

  const snap = await get(ref(db,"matches/"+today));

  const select = document.getElementById("matchSelect");

  select.innerHTML = "";

  if(!snap.exists()){
    select.innerHTML = "<option>No matches found</option>";
    return;
  }

  const matches = snap.val();

  Object.values(matches).forEach(m=>{

    const option = document.createElement("option");

    option.value = (m.home + "_" + m.away).replaceAll(" ","_");
    option.textContent = `${m.home} vs ${m.away}`;

    select.appendChild(option);
  });
}

loadMatches();

// =====================
// ADD TIP (AUTO KEY)
// =====================
window.addTip = function(){

  const matchKey = document.getElementById("matchSelect").value;
  const tipValue = document.getElementById("tip").value;

  if(!tipValue){
    alert("Enter a tip first");
    return;
  }

  set(ref(db,"tips/"+today+"/"+matchKey),{
    tip: tipValue
  });

  alert("Tip added successfully!");
};

// =====================
// ADD VIP USER
// =====================
window.addVIP = function(){

  const phone = vipPhone.value;
  const expiry = vipExpiry.value;

  set(ref(db,"users/"+phone),{
    vip:true,
    expiry:expiry
  });

  alert("VIP user added!");
};

</script>

</body>
  </html>
