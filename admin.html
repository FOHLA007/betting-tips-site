<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  padding: 20px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 12px;
  max-width: 500px;
  margin: auto;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  background: linear-gradient(45deg,#ff3b3b,#ff8c00);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.match {
  background: #222;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1 style="text-align:center;">⚙️ Admin Panel</h1>

<div class="card">

  <h3>Add Match Tip</h3>

  <input id="home" placeholder="Home Team">
  <input id="away" placeholder="Away Team">
  <input id="tip" placeholder="Tip (e.g Arsenal Win)">
  <input id="confidence" placeholder="Confidence (e.g 85%)">
  <input id="status" placeholder="Status (SCHEDULED / LIVE / FINISHED)">

  <button onclick="saveTip()">SAVE TIP</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

window.saveTip = function () {

  const home = document.getElementById("home").value;
  const away = document.getElementById("away").value;
  const tip = document.getElementById("tip").value;
  const confidence = document.getElementById("confidence").value;
  const status = document.getElementById("status").value;

  const key = home.replaceAll(" ", "_") + "_vs_" + away.replaceAll(" ", "_");

  set(ref(db, "tips/" + today + "/" + key), {
    home,
    away,
    tip,
    confidence,
    status
  });

  alert("Tip saved successfully ✅");
};
</script>

</body>
  </html>
