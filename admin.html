<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body {
  font-family: Inter;
  background: linear-gradient(135deg,#020617,#0f172a);
  color:white;
  padding:20px;
}

.card {
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 0 15px rgba(0,255,200,0.1);
}

input,select,button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

button {
  background:#00ffcc;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>⚙️ FOHLA ADMIN</h2>

<!-- ADD MATCH -->
<div class="card">
<h3>➕ Add Match</h3>

<input id="home" placeholder="Home Team (e.g Liverpool)">
<input id="away" placeholder="Away Team (e.g Arsenal)">
<input id="time" placeholder="Time (e.g 18:30)">

<select id="status">
<option value="TIMED">Not Started</option>
<option value="IN_PLAY">Live</option>
<option value="PAUSED">Half Time</option>
<option value="FINISHED">Finished</option>
</select>

<button onclick="addMatch()">Add Match</button>
</div>

<!-- ADD TIP -->
<div class="card">
<h3>🔥 Add Tip</h3>

<input id="tipHome" placeholder="Home Team">
<input id="tipAway" placeholder="Away Team">

<select id="tip">
<option>Home Win</option>
<option>Away Win</option>
<option>Draw</option>
<option>Over 1.5</option>
<option>Over 2.5</option>
<option>Under 2.5</option>
<option>BTTS YES</option>
<option>BTTS NO</option>
</select>

<button onclick="addTip()">Save Tip</button>
</div>

<!-- VIP USERS -->
<div class="card">
<h3>💎 Add VIP User</h3>

<input id="vipPhone" placeholder="Phone (e.g 27655775885)">

<button onclick="addVIP()">Activate VIP (7 days)</button>
<p id="msg"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL:"https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

const today=new Date().toISOString().split("T")[0];

// ADD MATCH
window.addMatch = async function(){

const home = document.getElementById("home").value;
const away = document.getElementById("away").value;
const time = document.getElementById("time").value;
const status = document.getElementById("status").value;

if(!home || !away) return alert("Fill all fields");

const key = (home+"_"+away).replaceAll(" ","_");

await set(ref(db,"matches/"+today+"/"+key),{
  home,
  away,
  time,
  status,
  score:"0-0"
});

alert("Match Added ✅");
};

// ADD TIP
window.addTip = async function(){

const home = document.getElementById("tipHome").value;
const away = document.getElementById("tipAway").value;
const tip = document.getElementById("tip").value;

const key = (home+"_"+away).replaceAll(" ","_");

await set(ref(db,"tips/"+today+"/"+key),{
  home,
  away,
  tip
});

alert("Tip Saved 🔥");
};

// VIP
window.addVIP = async function(){

const phone = document.getElementById("vipPhone").value;

if(!phone) return;

const exp = new Date();
exp.setDate(exp.getDate()+7);

await set(ref(db,"users/"+phone),{
  vip:true,
  expiry:exp.toISOString()
});

document.getElementById("msg").innerText="VIP Activated ✅";
};

</script>

</body>
</html>
