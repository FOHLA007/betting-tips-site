<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin VIP Betting</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#0b0f1a;
  color:white;
}

header{
  background:linear-gradient(135deg,#ffb400,#ff3b3b);
  padding:20px;
  text-align:center;
}

.container{padding:15px;}

.card{
  background:#121a2a;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
}

.match{
  border-left:4px solid #ffb400;
  padding:10px;
  margin:10px 0;
  background:#0f1726;
  border-radius:8px;
}

/* VIP BOX */
.vip-box{
  border:2px solid gold;
  padding:15px;
  border-radius:12px;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  font-weight:bold;
  border-radius:10px;
  cursor:pointer;
}

/* VIP BUTTON */
.vip-btn{
  background:linear-gradient(135deg,#25D366,#128C7E);
  color:white;
}

/* FOOTER */
footer{
  text-align:center;
  padding:15px;
  margin-top:20px;
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<header>
<h2>🔥 FohlaWin VIP Betting</h2>
<p>Live Matches + Premium Tips</p>
</header>

<div class="container">

<!-- VIP SECTION -->
<div class="card vip-box">
<h3>💰 VIP Access</h3>
<p>Enter VIP password or join WhatsApp</p>

<input id="vipPass" placeholder="Enter VIP Password">

<button onclick="checkVIP()" style="background:gold;">ACCESS VIP</button>

<a href="https://wa.me/27821234567?text=I%20want%20VIP">
<button class="vip-btn">JOIN VIA WHATSAPP</button>
</a>

<p id="vipStatus"></p>
</div>

<!-- MATCHES -->
<div class="card">
<h3>⚽ Live Matches</h3>
<div id="matches">Loading...</div>
</div>

</div>

<footer>
© <span id="year"></span> FohlaWin Betting. All rights reserved.
</footer>

<script>
document.getElementById("year").innerText = new Date().getFullYear();
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const container = document.getElementById("matches");
const today = new Date().toISOString().split("T")[0];

const matchesRef = ref(db, "matches/" + today);
const tipsRef = ref(db, "tips/" + today);

let matches = {};
let tips = {};

let vipUnlocked = false;

// VIP PASSWORD SYSTEM (simple but working)
window.checkVIP = function(){

  const pass = document.getElementById("vipPass").value;

  if(pass === "FOHLA2026"){
    vipUnlocked = true;
    document.getElementById("vipStatus").innerText = "VIP UNLOCKED 🔥";
  } else {
    document.getElementById("vipStatus").innerText = "Wrong password ❌";
  }
};

// LOAD DATA
onValue(matchesRef, (snap)=>{
  matches = snap.val() || {};
  render();
});

onValue(tipsRef, (snap)=>{
  tips = snap.val() || {};
  render();
});

// RENDER
function render(){

  let html = "";

  Object.values(matches).forEach(m=>{

    const key = (m.home+"_"+m.away).replaceAll(" ","_");
    const tip = tips[key];

    html += `
      <div class="match">
        <b>${m.home} vs ${m.away}</b>
        <p>Score: ${m.score || "0-0"}</p>
        <p>Status: ${m.status || "pending"}</p>

        ${
          vipUnlocked
          ? (tip ? "<p>🔥 VIP TIP: "+tip.tip+"</p>" : "<p>No tip</p>")
          : "<p>🔒 VIP LOCKED</p>"
        }
      </div>
    `;
  });

  container.innerHTML = html || "<p>No matches today</p>";
}
</script>

</body>
</html>
