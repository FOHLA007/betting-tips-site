<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin LIVE Tips</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0f0f0f;
  color: white;
}

header {
  background: linear-gradient(45deg,#ff3b3b,#ff8c00);
  padding: 20px;
  text-align: center;
}

.container {
  padding: 15px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin: 15px 0;
  border-radius: 12px;
}

.match {
  border-left: 4px solid #f5c542;
  padding-left: 10px;
  margin: 10px 0;
}

.win {
  color: #00ff88;
  font-weight: bold;
}

.loss {
  color: #ff4d4d;
  font-weight: bold;
}

.vip {
  border: 2px solid #ff3b3b;
  padding: 15px;
  border-radius: 12px;
}

.vip-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  background: linear-gradient(45deg,#ff3b3b,#ff8c00);
  color: white;
}
</style>
</head>

<body>

<header>
<h1>🔥 LIVE Betting Tips</h1>
<p>Updated Automatically</p>
</header>

<div class="container">

  <!-- PERFORMANCE -->
  <div class="card">
    <h3>📊 Performance</h3>
    <p class="win">Win Rate: 82%</p>
  </div>

  <!-- LIVE MATCHES -->
  <div class="card">
    <h3>⚽ Live Matches</h3>
    <div id="matches">Loading matches...</div>
  </div>

  <!-- VIP -->
  <div class="card vip">
    <h3>💎 VIP ACCESS</h3>
    <p>Join VIP for exclusive tips</p>
    <a href="https://wa.me/27821234567">
      <button class="vip-btn">JOIN VIP 🔥</button>
    </a>
  </div>

</div>

<!-- FIREBASE SCRIPT -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// IMPORTANT: must match your Replit data date
const today = new Date().toISOString().split("T")[0];

const matchesRef = ref(db, "matches/" + today);

onValue(matchesRef, (snapshot) => {
  const data = snapshot.val();
  let html = "";

  if (!data) {
    document.getElementById("matches").innerHTML = "<p>No matches today</p>";
    return;
  }

  Object.values(data).forEach((m) => {

    const home = m?.home || m?.homeTeam || "Unknown";
    const away = m?.away || m?.awayTeam || "Unknown";
    const score = m?.score || "N/A";
    const status = m?.status || "pending";

    html += `
      <div class="match">
        <b>${home} vs ${away}</b>
        <p>Score: ${score}</p>
        <p>Status: ${status}</p>
      </div>
    `;
  });

  document.getElementById("matches").innerHTML = html;
});
  </script>
</body>
  </html>
