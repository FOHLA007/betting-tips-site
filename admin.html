<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body {
  font-family: Inter;
  background: linear-gradient(135deg,#0f172a,#020617);
  color:white;
  padding:20px;
}

.card {
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  box-shadow:0 0 20px rgba(0,255,200,0.1);
}

select,button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

button {
  background:#00ffcc;
  font-weight:bold;
}

h2 {
  text-align:center;
}
</style>
</head>

<body>

<h2>⚙️ Admin Dashboard</h2>

<div class="card">
<h3>Select Match</h3>

<select id="matchSelect">
<option>Loading matches...</option>
</select>

<select id="tipSelect">
<option>Home Win</option>
<option>Away Win</option>
<option>Draw</option>
<option>Over 1.5</option>
<option>Over 2.5</option>
<option>Under 2.5</option>
<option>BTTS YES</option>
<option>BTTS NO</option>
</select>

<button onclick="save()">Save Tip</button>
</div>

<div class="card">
<h3>Saved Tips</h3>
<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

let matches = {};

// 🔥 LOAD MATCHES CORRECTLY
async function loadMatches(){

const snap = await get(ref(db,"matches/"+today));

let select = document.getElementById("matchSelect");

if(!snap.exists()){
select.innerHTML = "<option>No matches found</option>";
return;
}

matches = snap.val();

// FIX OBJECT → ARRAY
const matchArray = Object.values(matches);

let html = "";

matchArray.forEach(m=>{

const key = (m.home + "_" + m.away).replaceAll(" ","_");

html += `<option value="${key}">
${m.home} vs ${m.away} (${m.time || "No time"})
</option>`;

});

select.innerHTML = html;

loadList();
}

// 🔥 SAVE TIP
async function save(){

const key = document.getElementById("matchSelect").value;
const tip = document.getElementById("tipSelect").value;

const m = Object.values(matches).find(x =>
(m.home+"_"+m.away).replaceAll(" ","_") === key
);

await set(ref(db,"tips/"+today+"/"+key),{
home: m.home,
away: m.away,
tip: tip,
status: m.status
});

alert("Tip Saved!");
loadList();
}

// 🔥 SHOW SAVED TIPS
async function loadList(){

const snap = await get(ref(db,"tips/"+today));

let html = "";

if(snap.exists()){
Object.values(snap.val()).forEach(t=>{
html += `<p>🔥 ${t.home} vs ${t.away} → ${t.tip}</p>`;
});
}

document.getElementById("list").innerHTML = html;
}

loadMatches();
</script>

</body>
  </html>
