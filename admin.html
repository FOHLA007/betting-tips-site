<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body {
  font-family: Poppins;
  background: #0b0f1a;
  color: white;
  padding: 20px;
}

.card {
  background: #121a2a;
  padding: 15px;
  max-width: 500px;
  margin: auto;
  border-radius: 12px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: gold;
  border: none;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>⚙ Admin Panel</h2>

<div class="card">

<h3>Add Match</h3>

<input id="home" placeholder="Home team">
<input id="away" placeholder="Away team">
<input id="score" placeholder="Score">
<input id="status" placeholder="Status">

<button onclick="addMatch()">ADD MATCH</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

// add match
window.addMatch = function () {

  push(ref(db, "matches/" + today), {
    home: home.value,
    away: away.value,
    score: score.value,
    status: status.value
  });

  alert("Match added successfully");
};
</script>

</body>
</html>
