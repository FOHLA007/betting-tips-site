<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Betting Dashboard Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Poppins;
  background:#0a0f1c;
  color:white;
}

/* HEADER */
header {
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  padding:20px;
  text-align:center;
}

/* HERO */
.hero {
  padding:20px;
  text-align:center;
  background:#10182b;
}

/* CARD */
.card {
  background:#121a2a;
  padding:15px;
  margin:12px;
  border-radius:14px;
}

/* DASHBOARD GRID */
.dashboard {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* STATS CARD */
.stat {
  background:#0f1726;
  padding:15px;
  border-radius:12px;
  text-align:center;
  border:1px solid #1f2a44;
}

.stat h2 {
  margin:0;
  font-size:18px;
}

.stat p {
  margin:5px 0;
  font-size:14px;
  opacity:0.8;
}

/* COLORS */
.green {color:#00ff88;}
.red {color:#ff4d4d;}
.gold {color:#ffd700;}
.blue {color:#00d4ff;}

/* MATCH CARD */
.match {
  background:#0f1726;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  border-left:4px solid #00ffcc;
}

/* BUTTON */
button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#00ffcc;
  font-weight:bold;
}

/* VIP BUTTON */
.vip-btn {
  background:#25D366;
  color:white;
}

/* FOOTER */
footer {
  text-align:center;
  padding:15px;
  opacity:0.6;
  font-size:12px;
}
</style>
</head>

<body>

<header>
<h2>🔥 VIP Betting Dashboard Pro</h2>
<p>AI Betting • Live Tips • Analytics</p>
</header>

<!-- VIP LOGIN -->
<div class="card">
<h3>🔐 VIP Login</h3>
<input id="phone" placeholder="Enter phone number" style="width:100%;padding:10px;border-radius:8px;border:none;">
<button onclick="checkVIP()">Unlock VIP</button>
<p id="status"></p>
</div>

<!-- DASHBOARD -->
<div class="card" id="dash" style="display:none;">

<h3>📊 Performance Dashboard</h3>

<div class="dashboard">

<div class="stat">
<h2 id="total">0</h2>
<p>Total Tips</p>
</div>

<div class="stat">
<h2 id="wins" class="green">0</h2>
<p>Wins</p>
</div>

<div class="stat">
<h2 id="losses" class="red">0</h2>
<p>Losses</p>
</div>

<div class="stat">
<h2 id="winrate" class="gold">0%</h2>
<p>Win Rate</p>
</div>

<div class="stat" style="grid-column:span 2;">
<h2 id="profit" class="blue">R0</h2>
<p>Estimated Profit (R50 per win)</p>
</div>

</div>
</div>

<!-- MATCHES -->
<div class="card">
<h3>⚽ Live Matches</h3>
<div id="matches">Loading...</div>
</div>

<footer>
© 2026 VIP Betting System
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

let vip = false;
let matches = {};
let tips = {};

load();

async function load(){

  const today = new Date().toISOString().split("T")[0];

  const mSnap = await get(ref(db,"matches/"+today));
  const tSnap = await get(ref(db,"tips/"+today));

  if(mSnap.exists()) matches = mSnap.val();
  if(tSnap.exists()) tips = tSnap.val();

  render();
}

// VIP LOGIN
window.checkVIP = async function(){

  const phone = document.getElementById("phone").value;

  const snap = await get(ref(db,"users/"+phone));

  if(!snap.exists()){
    document.getElementById("status").innerText = "Not VIP ❌";
    return;
  }

  const user = snap.val();

  if(user.vip && new Date(user.expiry) > new Date()){
    vip = true;
    document.getElementById("status").innerText = "VIP ACTIVE 🔥";
    loadDashboard();
  } else {
    vip = false;
    document.getElementById("status").innerText = "VIP EXPIRED ❌";
  }

  render();
};

// DASHBOARD
function loadDashboard(){

  let total = 0;
  let wins = 0;
  let losses = 0;

  Object.values(tips).forEach(t => {

    if(!t.result) return;

    total++;

    if(t.result === "WON") wins++;
    if(t.result === "LOST") losses++;

  });

  let winrate = total ? ((wins/total)*100).toFixed(1) : 0;
  let profit = (wins * 50) - (losses * 50);

  document.getElementById("dash").style.display = "block";
  document.getElementById("total").innerText = total;
  document.getElementById("wins").innerText = wins;
  document.getElementById("losses").innerText = losses;
  document.getElementById("winrate").innerText = winrate + "%";
  document.getElementById("profit").innerText = "R" + profit;
}

// RENDER MATCHES
function render(){

  let html = "";

  Object.values(matches).forEach(m => {

    const key = (m.home + "_" + m.away).replaceAll(" ","_");
    const tip = tips[key];

    let tipText = vip
      ? (tip ? "🔥 " + tip.tip : "No tip")
      : "🔒 VIP ONLY";

    html += `
      <div class="match">
        <b>${m.home} vs ${m.away}</b><br>
        Score: ${m.score || "0-0"}<br>
        Status: ${m.status || "TIMED"}<br>
        <p>${tipText}</p>
      </div>
    `;
  });

  document.getElementById("matches").innerHTML = html;
}
</script>

</body>
</html>
