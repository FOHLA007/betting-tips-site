<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const container = document.getElementById("matches");

// 🔥 WE LISTEN TO ROOT (NO STRUCTURE ASSUMPTIONS)
onValue(ref(db, "/"), (snapshot) => {

  const data = snapshot.val();

  let matches = [];

  // 🔥 SMART SCANNER (find ANY matches anywhere)
  function scan(obj) {

    if (!obj || typeof obj !== "object") return;

    for (let key in obj) {

      const value = obj[key];

      // match object detection
      if (value && typeof value === "object") {

        if (value.home && value.away) {
          matches.push(value);
        }

        scan(value); // keep searching deeper
      }
    }
  }

  scan(data);

  render(matches);
});

// 🔥 RENDER FUNCTION

    container.innerHTML = "<p>No matches found yet</p>";
    return;
