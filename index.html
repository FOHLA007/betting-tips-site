<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin VIP Betting</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {margin:0;font-family:Poppins;background:#0b0f1a;color:white;}
header {background:linear-gradient(135deg,#ffb400,#ff3b3b);padding:20px;text-align:center;}
.container {padding:15px;}
.card {background:#121a2a;padding:15px;margin:10px 0;border-radius:12px;}
.match {border-left:4px solid gold;padding:10px;margin:10px 0;background:#0f1726;border-radius:8px;}
input,button {width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;}
button {background:gold;font-weight:bold;cursor:pointer;}
.vip-btn {background:#25D366;color:white;}
footer {text-align:center;padding:15px;font-size:12px;opacity:0.7;}
</style>
</head>

<body>

<header>
<h2>🔥 FohlaWin VIP Betting</h2>
<p>Live Matches + Premium Tips</p>
</header>

<div class="container">

<div class="card">
<h3>💰 VIP Login</h3>

<input id="phone" placeholder="Enter your phone number">

<button onclick="checkVIP()">ENTER VIP</button>

<a href="https://wa.me/27821234567?text=I want VIP access">
<button class="vip-btn">JOIN VIA WHATSAPP</button>
</a>

<p id="vipStatus"></p>
</div>

<div class="card">
<h3>⚽ Live Matches</h3>
<div id="matches">Loading matches...</div>
</div>

</div>

<footer>
© <span id="year"></span> FohlaWin Betting
</footer>

<script>
document.getElementById("year").innerText = new Date().getFullYear();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

const container = document.getElementById("matches");

let vipUnlocked = false;
let savedMatches = {};
let savedTips = {};

// 🚀 LOAD EVERYTHING ON START
loadAll();

// =====================
// LOAD MATCHES + TIPS
// =====================
async function loadAll(){

  try {

    container.innerHTML = "Loading matches...";

    const today = new Date().toISOString().split("T")[0];

    let matchSnap = await get(ref(db,"matches/"+today));

    if(matchSnap.exists()){

      savedMatches = matchSnap.val();

      const tipSnap = await get(ref(db,"tips/"+today));
      savedTips = tipSnap.exists() ? tipSnap.val() : {};

    } else {

      // 🔥 FALLBACK TO LATEST DATE
      const allSnap = await get(ref(db,"matches"));

      if(!allSnap.exists()){
        container.innerHTML = "<p>No matches available</p>";
        return;
      }

      const all = allSnap.val();
      const latest = Object.keys(all).sort().reverse()[0];

      savedMatches = all[latest];

      const tipSnap = await get(ref(db,"tips/"+latest));
      savedTips = tipSnap.exists() ? tipSnap.val() : {};
    }

    render();

  } catch(e){
    container.innerHTML = "<p>Error loading matches</p>";
    console.error(e);
  }

}

// =====================
// VIP LOGIN
// =====================
window.checkVIP = async function(){

  const phone = document.getElementById("phone").value;

  try {

    const snap = await get(ref(db,"users/"+phone));

    if(!snap.exists()){
      document.getElementById("vipStatus").innerText = "Not VIP ❌";
      return;
    }

    const user = snap.val();

    if(user.vip && new Date(user.expiry) > new Date()){
      vipUnlocked = true;
      document.getElementById("vipStatus").innerText = "VIP ACTIVE 🔥";
    } else {
      vipUnlocked = false;
      document.getElementById("vipStatus").innerText = "VIP EXPIRED ❌";
    }

    // 🔥 REFRESH UI AFTER LOGIN
    render();

  } catch(e){
    document.getElementById("vipStatus").innerText = "Error checking VIP";
  }
};

// =====================
// RENDER FUNCTION
// =====================
function render(){

  let html = "";

  Object.values(savedMatches).forEach(m => {

    const key = (m.home + "_" + m.away).replaceAll(" ","_");
    const tip = savedTips[key];

    html += `
      <div class="match">
        <b>${m.home || "Team A"} vs ${m.away || "Team B"}</b>
        <p>Score: ${m.score || "0-0"}</p>
        <p>Status: ${m.status || "pending"}</p>

        ${
          vipUnlocked
          ? (tip ? "<p>🔥 TIP: "+tip.tip+"</p>" : "<p>No tip yet</p>")
          : "<p>🔒 VIP ONLY</p>"
        }
      </div>
    `;
  });

  container.innerHTML = html || "<p>No matches found</p>";
}
</script>

</body>
  </html>
