<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin VIP Tips</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0f0f0f;
  color: white;
}

header {
  background: linear-gradient(45deg,#ff3b3b,#ff8c00);
  padding: 20px;
  text-align: center;
}

.container {
  padding: 15px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin: 15px 0;
  border-radius: 12px;
}

.match {
  border-left: 4px solid #f5c542;
  padding-left: 10px;
  margin: 10px 0;
}

.vip {
  border: 2px solid #ff3b3b;
  text-align: center;
}

.vip-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  background: linear-gradient(45deg,#ff3b3b,#ff8c00);
  color: white;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}
</style>
</head>

<body>

<header>
<h1>🔥 FohlaWin VIP Tips</h1>
<p>Daily Winning Predictions</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div class="card vip">
    <h3>🔐 VIP LOGIN</h3>
    <input type="password" id="vipPassword" placeholder="Enter VIP Password">
    <button class="vip-btn" onclick="loginVIP()">UNLOCK VIP 🔓</button>
  </div>

  <!-- MATCHES -->
  <div class="card">
    <h3>⚽ Live Matches</h3>
    <div id="matches">Loading matches...</div>
  </div>

  <!-- VIP CTA -->
  <div class="card vip">
    <h3>💎 VIP ACCESS</h3>
    <p>🔥 Daily Sure Tips</p>
    <p>💰 High Winning Rate</p>

    <a href="https://wa.me/27655775885">
      <button class="vip-btn">JOIN VIP NOW 🔥</button>
    </a>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];
const matchesRef = ref(db, "matches/" + today);

// 🔐 CHECK VIP STATUS
let isVIP = localStorage.getItem("vip") === "true";

window.loginVIP = function () {
  const password = document.getElementById("vipPassword").value;

  if (password === "32083") { // 🔥 CHANGE THIS PASSWORD
    localStorage.setItem("vip", "true");
    alert("VIP Unlocked 🔥");
    location.reload();
  } else {
    alert("Wrong Password ❌");
  }
};

onValue(matchesRef, (snapshot) => {
  const data = snapshot.val();
  let html = "";

  if (!data) {
    document.getElementById("matches").innerHTML = "<p>No matches today</p>";
    return;
  }

  Object.values(data).forEach((m) => {

    const home = m.home || "Unknown";
    const away = m.away || "Unknown";
    const status = m.status || "pending";

    html += `
      <div class="match">
        <b>${home} vs ${away}</b>

        ${
          isVIP
          ? `
            <p>🔥 Tip: ${m.tip || "No tip yet"}</p>
            <p>📊 Confidence: ${m.confidence || "80%"}</p>
          `
          : `
            <p>🔒 VIP ONLY TIP</p>
          `
        }

        <p>Status: ${status}</p>
      </div>
    `;
  });

  document.getElementById("matches").innerHTML = html;
});
</script>

</body>
</html>
