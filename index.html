<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Betting App</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:Inter;
  background:#0b0f1a;
  color:white;
}

/* HEADER */
.header {
  padding:18px;
  text-align:center;
  background:linear-gradient(135deg,#1a2a6c,#0f172a);
}

/* NAV */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#0f172a;
  padding:10px 0;
  border-top:1px solid #1f2a44;
}

.nav button {
  background:none;
  border:none;
  color:white;
  font-size:12px;
}

/* PAGE */
.page {
  display:none;
  padding:15px;
  padding-bottom:80px;
}

.active {
  display:block;
}

/* CARD */
.card {
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  border:1px solid #1f2a44;
}

/* STATS GRID */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat {
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  text-align:center;
}

.stat h2 {
  margin:0;
  color:#00ffcc;
}

/* MATCH */
.match {
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  border-left:3px solid #00ffcc;
}

/* BUTTON */
button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00ffcc;
  font-weight:bold;
}

/* VIP */
.lock {
  opacity:0.5;
}
</style>
</head>

<body>

<div class="header">
<h2>🔥 VIP Betting App</h2>
<p>AI Tips • Live Matches • Analytics</p>
</div>

<!-- HOME PAGE -->
<div class="page active" id="home">
  <div class="card">
    <h3>⚽ Live Matches</h3>
    <div id="matches">Loading...</div>
  </div>
</div>

<!-- VIP PAGE -->
<div class="page" id="vip">
  <div class="card">
    <h3>🔐 VIP Login</h3>
    <input id="phone" placeholder="Enter phone" style="width:100%;padding:10px;">
    <button onclick="checkVIP()">Unlock VIP</button>
    <p id="status"></p>
  </div>

  <div class="card" id="vipTips" style="display:none;">
    <h3>🔥 VIP Tips</h3>
    <div id="tips"></div>
  </div>
</div>

<!-- STATS PAGE -->
<div class="page" id="stats">
  <div class="card">
    <h3>📊 Performance Stats</h3>

    <div class="grid">
      <div class="stat"><h2 id="wins">0</h2><p>Wins</p></div>
      <div class="stat"><h2 id="losses">0</h2><p>Losses</p></div>
      <div class="stat"><h2 id="winrate">0%</h2><p>Win Rate</p></div>
      <div class="stat"><h2 id="profit">R0</h2><p>Profit</p></div>
    </div>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="show('home')">🏠 Home</button>
  <button onclick="show('vip')">🔐 VIP</button>
  <button onclick="show('stats')">📊 Stats</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

let vip = false;
let matches = {};
let tips = {};

const today = new Date().toISOString().split("T")[0];

load();

async function load(){

  const m = await get(ref(db,"matches/"+today));
  const t = await get(ref(db,"tips/"+today));

  if(m.exists()) matches = m.val();
  if(t.exists()) tips = t.val();

  renderMatches();
  loadStats();
}

/* NAV */
window.show = (page)=>{
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
};

/* VIP LOGIN */
window.checkVIP = async function(){

  const phone = document.getElementById("phone").value;

  const snap = await get(ref(db,"users/"+phone));

  if(!snap.exists()){
    document.getElementById("status").innerText = "Not VIP ❌";
    return;
  }

  const u = snap.val();

  if(u.vip && new Date(u.expiry) > new Date()){
    vip = true;
    document.getElementById("status").innerText = "VIP ACTIVE 🔥";
    loadVIP();
  } else {
    document.getElementById("status").innerText = "VIP EXPIRED ❌";
  }
};

/* MATCHES */
function renderMatches(){

  let html = "";

  Object.values(matches).forEach(m=>{

    const key = (m.home+"_"+m.away).replaceAll(" ","_");
    const tip = tips[key];

    html += `
      <div class="match">
        <b>${m.home} vs ${m.away}</b><br>
        ${m.score} | ${m.status}<br>
        <p>${vip ? (tip ? "🔥 "+tip.tip : "No tip") : "🔒 VIP ONLY"}</p>
      </div>
    `;
  });

  document.getElementById("matches").innerHTML = html;
}

/* VIP TIPS */
function loadVIP(){

  document.getElementById("vipTips").style.display = "block";

  let html = "";

  Object.values(tips).forEach(t=>{

    if(!t.tip) return;

    html += `<p>🔥 ${t.tip} <small>(${t.result || "PENDING"})</small></p>`;
  });

  document.getElementById("tips").innerHTML = html;
}

/* STATS */
function loadStats(){

  let wins=0,losses=0,total=0;

  Object.values(tips).forEach(t=>{

    if(!t.result) return;

    total++;

    if(t.result==="WON") wins++;
    if(t.result==="LOST") losses++;

  });

  let wr = total ? ((wins/total)*100).toFixed(1) : 0;
  let profit = (wins*50)-(losses*50);

  document.getElementById("wins").innerText = wins;
  document.getElementById("losses").innerText = losses;
  document.getElementById("winrate").innerText = wr+"%";
  document.getElementById("profit").innerText = "R"+profit;
}
</script>

</body>
</html>
