<!DOCTYPE html>
<html>
<head>
<title>FOHLA ADMIN PRO</title>

<style>
body {
  font-family:Inter;
  background:#020617;
  color:white;
  padding:20px;
}

.card {
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

input,select,button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

button {
  background:#00ffcc;
  font-weight:bold;
}

.delete {
  background:#ff4d4d;
}
</style>
</head>

<body>

<h2>⚙️ FOHLA ADMIN PRO</h2>

<!-- ADD MATCH -->
<div class="card">
<h3>➕ Add Match</h3>
<input id="home" placeholder="Home Team">
<input id="away" placeholder="Away Team">
<input id="time" placeholder="Time (18:30)">

<select id="status">
<option value="TIMED">Not Started</option>
<option value="IN_PLAY">Live</option>
<option value="PAUSED">Half Time</option>
<option value="FINISHED">Finished</option>
</select>

<button onclick="addMatch()">Add Match</button>
</div>

<!-- UPDATE SCORE -->
<div class="card">
<h3>📊 Update Score</h3>

<input id="uHome" placeholder="Home Team">
<input id="uAway" placeholder="Away Team">
<input id="score" placeholder="Score (2-1)">

<select id="uStatus">
<option value="IN_PLAY">Live</option>
<option value="PAUSED">Half Time</option>
<option value="FINISHED">Finished</option>
</select>

<button onclick="updateScore()">Update Match</button>
</div>

<!-- ADD TIP -->
<div class="card">
<h3>🔥 Add Tip</h3>

<input id="tipHome" placeholder="Home Team">
<input id="tipAway" placeholder="Away Team">

<select id="tip">
<option>Home Win</option>
<option>Away Win</option>
<option>Draw</option>
<option>Over 2.5</option>
<option>BTTS YES</option>
<option>BTTS NO</option>
</select>

<button onclick="addTip()">Save Tip</button>
</div>

<!-- DELETE -->
<div class="card">
<h3>❌ Delete</h3>

<input id="dHome" placeholder="Home Team">
<input id="dAway" placeholder="Away Team">

<button class="delete" onclick="deleteMatch()">Delete Match</button>
<button class="delete" onclick="deleteTip()">Delete Tip</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL:"https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);
const today=new Date().toISOString().split("T")[0];

// ADD MATCH
window.addMatch = async function(){
const home=homeInput("home");
const away=homeInput("away");
const time=homeInput("time");
const status=document.getElementById("status").value;

const key=keyGen(home,away);

await set(ref(db,"matches/"+today+"/"+key),{
home,away,time,status,score:"0-0"
});

alert("Match Added ✅");
};

// UPDATE SCORE
window.updateScore = async function(){

const home=homeInput("uHome");
const away=homeInput("uAway");
const score=document.getElementById("score").value;
const status=document.getElementById("uStatus").value;

const key=keyGen(home,away);

await set(ref(db,"matches/"+today+"/"+key+"/score"),score);
await set(ref(db,"matches/"+today+"/"+key+"/status"),status);

// AUTO RESULT
const tipSnap=await get(ref(db,"tips/"+today+"/"+key));

if(tipSnap.exists() && status==="FINISHED"){

const tipData=tipSnap.val();
const result=calculateResult(score,tipData.tip);

await set(ref(db,"tips/"+today+"/"+key+"/result"),result);
}

alert("Updated ✅");
};

// ADD TIP
window.addTip = async function(){

const home=homeInput("tipHome");
const away=homeInput("tipAway");
const tip=document.getElementById("tip").value;

const key=keyGen(home,away);

await set(ref(db,"tips/"+today+"/"+key),{
home,away,tip
});

alert("Tip Saved 🔥");
};

// DELETE MATCH
window.deleteMatch = async function(){

const home=homeInput("dHome");
const away=homeInput("dAway");

const key=keyGen(home,away);

await remove(ref(db,"matches/"+today+"/"+key));

alert("Match Deleted ❌");
};

// DELETE TIP
window.deleteTip = async function(){

const home=homeInput("dHome");
const away=homeInput("dAway");

const key=keyGen(home,away);

await remove(ref(db,"tips/"+today+"/"+key));

alert("Tip Deleted ❌");
};

// HELPERS
function keyGen(home,away){
return (home+"_"+away).replaceAll(" ","_");
}

function homeInput(id){
return document.getElementById(id).value.trim();
}

// RESULT LOGIC
function calculateResult(score,tip){

const [h,a]=score.split("-").map(Number);

if(tip==="Home Win") return h>a ? "WON":"LOST";
if(tip==="Away Win") return a>h ? "WON":"LOST";
if(tip==="Draw") return h===a ? "WON":"LOST";
if(tip==="Over 2.5") return (h+a)>2 ? "WON":"LOST";
if(tip==="BTTS YES") return (h>0 && a>0) ? "WON":"LOST";
if(tip==="BTTS NO") return (h===0 || a===0) ? "WON":"LOST";

return "PENDING";
}

</script>

</body>
</html>
