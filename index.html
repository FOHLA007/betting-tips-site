<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin Live Tips</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0f0f0f;
  color: white;
}

header {
  background: linear-gradient(45deg,#ff3b3b,#ff8c00);
  padding: 20px;
  text-align: center;
}

.container {
  padding: 15px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin: 15px 0;
  border-radius: 12px;
}

.match {
  border-left: 4px solid #f5c542;
  padding-left: 10px;
  margin: 10px 0;
}
</style>
</head>

<body>

<header>
<h1>🔥 Live Betting Tips</h1>
<p>Auto Updated Matches</p>
</header>

<div class="container">

  <div class="card">
    <h3>⚽ Today's Matches</h3>
    <div id="matches">Loading...</div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

const matchesRef = ref(db, "matches/" + today);
const tipsRef = ref(db, "tips/" + today);

let matches = {};
let tips = {};

onValue(matchesRef, (snapshot) => {
  matches = snapshot.val() || {};
  render();
});

onValue(tipsRef, (snapshot) => {
  tips = snapshot.val() || {};
  render();
});

function render() {
  let html = "";

  Object.values(matches).forEach((m) => {

    const key = (m.home || "").replaceAll(" ", "_") + "_vs_" + (m.away || "").replaceAll(" ", "_");

    const tip = tips[key];

    html += `
      <div class="match">
        <b>${m.home || "Unknown"} vs ${m.away || "Unknown"}</b>

        ${
          tip
          ? `
            <p>🔥 Tip: ${tip.tip}</p>
            <p>📊 Confidence: ${tip.confidence}</p>
          `
          : `<p>🔒 No Tip Yet</p>`
        }

        <p>Status: ${m.status || "pending"}</p>
      </div>
    `;
  });

  document.getElementById("matches").innerHTML = html;
}
</script>

</body>
  </html>
