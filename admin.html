<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body {font-family:Arial;background:#111;color:white;padding:20px;}
input,select,button {padding:10px;margin:5px;width:100%;}
.card {background:#222;padding:15px;margin-top:10px;border-radius:10px;}
</style>
</head>
<body>

<h2>⚙️ Admin Panel</h2>

<div class="card">
<h3>Add Match + Tip</h3>

<input id="home" placeholder="Home Team">
<input id="away" placeholder="Away Team">

<select id="status">
<option value="TIMED">TIMED</option>
<option value="IN_PLAY">IN PLAY</option>
<option value="FINISHED">FINISHED</option>
</select>

<input id="time" placeholder="Kickoff Time e.g 18:30">

<input id="tip" placeholder="Tip (Home Win / Over 2.5 etc)">
<input id="odds" placeholder="Odds e.g 1.80">

<button onclick="save()">Save Match</button>
</div>

<div class="card">
<h3>Existing Matches</h3>
<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

const today=new Date().toISOString().split("T")[0];

async function save(){

const home=document.getElementById("home").value;
const away=document.getElementById("away").value;
const status=document.getElementById("status").value;
const time=document.getElementById("time").value;
const tip=document.getElementById("tip").value;
const odds=document.getElementById("odds").value;

const key=(home+"_"+away).replaceAll(" ","_");

await set(ref(db,"matches/"+today+"/"+key),{
home,away,status,time,score:"0-0"
});

await set(ref(db,"tips/"+today+"/"+key),{
home,away,tip,odds,status
});

alert("Saved!");
load();
}

async function load(){

const snap=await get(ref(db,"matches/"+today));

let html="";

if(snap.exists()){
const data=snap.val();

Object.values(data).forEach(m=>{
html+=`<p>${m.home} vs ${m.away} (${m.status})</p>`;
});
}

document.getElementById("list").innerHTML=html;
}

load();
</script>

</body>
  </html>
