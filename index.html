<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP Betting App</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  font-family:Inter;
  background: linear-gradient(135deg,#020617,#0f172a);
  color:white;
}

.header {
  text-align:center;
  padding:20px;
  background:linear-gradient(135deg,#1a2a6c,#0f172a);
}

.nav {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#020617;
  padding:10px;
  z-index:9999;
}

.nav button {
  flex:1;
  margin:5px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:white;
  font-weight:bold;
}

.page { display:none; padding:15px; padding-bottom:100px; }
.active { display:block; }

.card {
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.match {
  background:#020617;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
  border-left:4px solid #00ffcc;
}

.green {color:#00ff88;}
.red {color:#ff4d4d;}
.gold {color:#ffd700;}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00ffcc;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
<h2>🔥 VIP Betting App</h2>
<p>Live Matches • AI Tips • Premium Access</p>
</div>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
<h3>💎 VIP ACCESS</h3>
<p>R50 per week</p>

<p>
1. Make payment<br>
2. Send proof<br>
3. Get VIP access
</p>

<a href="https://wa.me/27655775885?text=I want VIP">
<button style="background:#25D366;color:white;">Join via WhatsApp</button>
</a>

<p style="color:gold;">⚠️ No refunds</p>
</div>

<div class="card">
<h3>⚽ Matches</h3>
<div id="matches">Loading...</div>
</div>

</div>

<!-- VIP -->
<div id="vip" class="page">

<div class="card">
<h3>🔐 VIP LOGIN</h3>

<input id="phone" placeholder="Enter phone number">

<button onclick="login()">Unlock VIP</button>

<p id="msg"></p>
</div>

<div id="vipBox" style="display:none;">
<div class="card">
<h3>🔥 VIP Tips</h3>
<div id="tips"></div>
</div>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('vip')">🔐 VIP</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
databaseURL:"https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

let vip=false;
let matches={}, tips={};

const today=new Date().toISOString().split("T")[0];

// NAV
window.show=(p)=>{
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
};

// LOAD DATA
async function load(){

const m=await get(ref(db,"matches/"+today));
const t=await get(ref(db,"tips/"+today));

if(m.exists()) matches=m.val();
if(t.exists()) tips=t.val();

render();
}

setInterval(load,60000);

// RENDER
function render(){

let html="";

Object.values(matches).forEach(m=>{

const key=(m.home+"_"+m.away).replaceAll(" ","_");
const tip=tips[key];

if(!tip) return;

let status="";

if(m.status==="IN_PLAY") status="<span class='red'>🔴 LIVE</span>";
else if(m.status==="FINISHED") status="<span class='green'>FT</span>";
else status="<span class='gold'>"+m.time+"</span>";

html+=`
<div class="match">
<b>${m.home} vs ${m.away}</b><br>
${status}<br>
Score: ${m.score}<br>
${vip ? "🔥 "+tip.tip : "🔒 VIP ONLY"}
</div>
`;
});

document.getElementById("matches").innerHTML=html;
}

// LOGIN
window.login=async function(){

const phone=document.getElementById("phone").value;

const snap=await get(ref(db,"users/"+phone));

if(!snap.exists()){
document.getElementById("msg").innerText="Not VIP";
return;
}

const u=snap.val();

if(u.vip && new Date(u.expiry)>new Date()){
vip=true;
localStorage.setItem("vip",phone);
document.getElementById("msg").innerText="VIP ACTIVE";
loadVIP();
render();
}else{
document.getElementById("msg").innerText="Expired";
}
};

// AUTO LOGIN
(async ()=>{
const saved=localStorage.getItem("vip");
if(!saved) return;

const snap=await get(ref(db,"users/"+saved));
if(!snap.exists()) return;

const u=snap.val();

if(u.vip && new Date(u.expiry)>new Date()){
vip=true;
loadVIP();
render();
}
})();

// VIP TIPS
function loadVIP(){

document.getElementById("vipBox").style.display="block";

let html="";

Object.values(tips).forEach(t=>{
html+=`<p>${t.home} vs ${t.away} → ${t.tip}</p>`;
});

document.getElementById("tips").innerHTML=html;
}

load();

</script>

</body>
</html>
