<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body {font-family:Arial;background:#111;color:white;padding:20px;}
select,input,button {padding:10px;margin:5px;width:100%;}
.card {background:#222;padding:15px;margin-top:10px;border-radius:10px;}
</style>
</head>
<body>

<h2>⚙️ Admin Panel (Smart Select)</h2>

<div class="card">
<h3>Select Match + Tip</h3>

<select id="matchSelect"></select>

<select id="tipSelect">
<option>Home Win</option>
<option>Away Win</option>
<option>Draw</option>
<option>Over 1.5</option>
<option>Over 2.5</option>
<option>Under 2.5</option>
<option>BTTS YES</option>
<option>BTTS NO</option>
</select>

<input id="odds" placeholder="Odds e.g 1.80">

<button onclick="save()">Save Tip</button>
</div>

<div class="card">
<h3>Matches Loaded</h3>
<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

let matches = {};

// 🔥 LOAD MATCHES FROM FIREBASE
async function loadMatches(){

const snap = await get(ref(db, "matches/" + today));

if(!snap.exists()) return;

matches = snap.val();

let selectHTML = "";

Object.values(matches).forEach(m => {

const key = (m.home + "_" + m.away).replaceAll(" ","_");

selectHTML += `
<option value="${key}">
${m.home} vs ${m.away} (${m.time || "No time"})
</option>
`;

});

document.getElementById("matchSelect").innerHTML = selectHTML;

loadList();
}

// 🔥 SAVE TIP
async function save(){

const key = document.getElementById("matchSelect").value;
const tip = document.getElementById("tipSelect").value;
const odds = document.getElementById("odds").value;

const m = matches[key];

await set(ref(db, "tips/" + today + "/" + key), {
home: m.home,
away: m.away,
tip: tip,
odds: odds,
status: m.status
});

alert("Tip Saved!");
}

// 🔥 DISPLAY LIST
async function loadList(){

const snap = await get(ref(db,"tips/"+today));

let html = "";

if(snap.exists()){
const data = snap.val();

Object.values(data).forEach(t=>{
html += `<p>🔥 ${t.home} vs ${t.away} → ${t.tip}</p>`;
});
}

document.getElementById("list").innerHTML = html;
}

loadMat ches();
</script>

</body>
  </html>
