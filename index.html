<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin Live Tips</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #0f0f0f;
  color: white;
}

header {
  background: linear-gradient(45deg,#ff3b3b,#ff8c00);
  padding: 20px;
  text-align: center;
}

.container {
  padding: 15px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin: 15px 0;
  border-radius: 12px;
}

.match {
  border-left: 4px solid #f5c542;
  padding-left: 10px;
  margin: 10px 0;
}
</style>
</head>

<body>

<header>
<h1>🔥 Live Betting Tips</h1>
<p>Auto Updated Matches</p>
</header>

<div class="container">

  <div class="card">
    <h3>⚽ Today's Matches</h3>
    <div id="matches">Loading matches...</div>
  </div>

</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

const matchesRef = ref(db, "matches/" + today);
const tipsRef = ref(db, "tips/" + today);

let matchesData = null;
let tipsData = null;

const container = document.getElementById("matches");

// LOAD MATCHES
onValue(matchesRef, (snapshot) => {
  matchesData = snapshot.val() || {};
  render();
});

// LOAD TIPS
onValue(tipsRef, (snapshot) => {
  tipsData = snapshot.val() || {};
  render();
});

// SAFE RENDER FUNCTION
function render() {

  // prevent infinite loading
  if (!matchesData) {
    container.innerHTML = "<p>No matches found today</p>";
    return;
  }

  let html = "";
  let hasData = false;

  Object.values(matchesData).forEach((m) => {

    if (!m) return;

    hasData = true;

    const home = m.home || "Unknown";
    const away = m.away || "Unknown";
    const status = m.status || "pending";

    const key = home.replaceAll(" ", "_") + "_vs_" + away.replaceAll(" ", "_");
    const tip = tipsData ? tipsData[key] : null;

    html += `
      <div class="match">
        <b>${home} vs ${away}</b>

        ${
          tip
          ? `
            <p>🔥 Tip: ${tip.tip}</p>
            <p>📊 Confidence: ${tip.confidence}</p>
          `
          : `<p>🔒 No Tip Yet</p>`
        }

        <p>Status: ${status}</p>
      </div>
    `;
  });

  if (!hasData) {
    container.innerHTML = "<p>No matches available</p>";
    return;
  }

  container.innerHTML = html;
}
</script>

</body>
</html>
