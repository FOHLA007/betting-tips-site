<!-- FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "0f8f230eb554439eb149cff85bee2975",
  authDomain: "bettingtips-9ea67.firebaseapp.com",
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/",
  projectId: "bettingtips-9ea67"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 👉 MUST MATCH YOUR REPLIT STRUCTURE
const today = new Date().toISOString().split("T")[0];
const matchesRef = ref(db, "matches/" + today);

onValue(matchesRef, (snapshot) => {
  const data = snapshot.val();
  let html = "";

  if (!data) {
    html = "<p>No matches today</p>";
  } else {
    Object.values(data).forEach((m) => {

  const home = m.homeTeam?.name || m.home || "Team A";
  const away = m.awayTeam?.name || m.away || "Team B";
  const score = m.score?.fullTime
    ? (m.score.fullTime.home ?? 0) + "-" + (m.score.fullTime.away ?? 0)
    : (m.score || "N/A");
  const status = m.status || "pending";

  html += `
    <div class="match">
      <b>${home} vs ${away}</b>
      <p>Score: ${score}</p>
      <p>Status: ${status}</p>
    </div>
  `;
});
  }

  document.getElementById("matches").innerHTML = html;
});
</script>
