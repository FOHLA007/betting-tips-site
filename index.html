<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FohlaWin VIP Tips</title>

<!-- PREMIUM FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0b0f1a;
  color: #ffffff;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #ffb400, #ff3b3b);
  padding: 25px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 5px 0 0;
  opacity: 0.9;
}

/* CONTAINER */
.container {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}

/* CARD STYLE */
.card {
  background: #121a2a;
  padding: 18px;
  margin: 15px 0;
  border-radius: 14px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

/* MATCH BOX */
.match {
  border-left: 4px solid #ffb400;
  padding: 10px 12px;
  margin: 10px 0;
  background: #0f1726;
  border-radius: 8px;
}

/* VIP */
.vip {
  border: 2px solid #ffb400;
}

/* BUTTON */
.vip-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  background: linear-gradient(135deg, #ffb400, #ff3b3b);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.vip-btn:hover {
  transform: scale(1.02);
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  margin-top: 30px;
  font-size: 13px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
<h1>🔥 FohlaWin VIP Tips</h1>
<p>Premium Football Predictions • Updated Daily</p>
</header>

<div class="container">

  <!-- VIP PAYMENT -->
  <div class="card vip">
    <h3>💎 VIP ACCESS</h3>
    <p>🔥 Daily Winning Tips</p>
    <p>💰 Price: R50 per week</p>

    <a href="https://wa.me/27655775885?text=Hi%20I%20want%20VIP%20access%20for%20FohlaWin">
      <button class="vip-btn">JOIN VIP ON WHATSAPP 🔥</button>
    </a>
  </div>

  <!-- VIP LOGIN -->
  <div class="card">
    <h3>🔐 VIP LOGIN</h3>
    <input type="password" id="vipPassword" placeholder="Enter VIP Password">
    <button class="vip-btn" onclick="loginVIP()">UNLOCK VIP</button>
  </div>

  <!-- MATCHES -->
  <div class="card">
    <h3>⚽ Live Matches</h3>
    <div id="matches">Loading matches...</div>
  </div>

</div>

<!-- FOOTER -->
<footer>
  © <span id="year"></span> FohlaWin VIP Tips • All Rights Reserved
</footer>

<!-- YEAR SCRIPT -->
<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://bettingtips-9ea67-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const today = new Date().toISOString().split("T")[0];

const matchesRef = ref(db, "matches/" + today);
const tipsRef = ref(db, "tips/" + today);

let matchesData = {};
let tipsData = {};

let isVIP = localStorage.getItem("vip") === "true";

// VIP LOGIN
window.loginVIP = function () {
  const pass = document.getElementById("vipPassword").value;

  if (pass === "FOHLA123") {
    localStorage.setItem("vip", "true");
    alert("VIP Unlocked 🔥");
    location.reload();
  } else {
    alert("Wrong Password ❌");
  }
};

// LOAD MATCHES
onValue(matchesRef, (snapshot) => {
  matchesData = snapshot.val() || {};
  render();
});

// LOAD TIPS
onValue(tipsRef, (snapshot) => {
  tipsData = snapshot.val() || {};
  render();
});

// RENDER
function render() {

  const container = document.getElementById("matches");

  if (!matchesData || Object.keys(matchesData).length === 0) {
    container.innerHTML = "<p>No matches today</p>";
    return;
  }

  let html = "";

  Object.values(matchesData).forEach((m) => {

    const home = m.home || "Unknown";
    const away = m.away || "Unknown";

    const key = home.replaceAll(" ", "_") + "_vs_" + away.replaceAll(" ", "_");
    const tip = tipsData[key];

    html += `
      <div class="match">
        <b>${home} vs ${away}</b>

        ${
          isVIP
          ? (tip
              ? `
                <p>🔥 Tip: ${tip.tip}</p>
                <p>📊 Confidence: ${tip.confidence}</p>
              `
              : `<p>🔒 No Tip Yet</p>`
            )
          : `<p>🔒 VIP ONLY</p>`
        }

        <p>Status: ${m.status || "pending"}</p>
      </div>
    `;
  });

  container.innerHTML = html;
}
</script>

</body>
</html>
